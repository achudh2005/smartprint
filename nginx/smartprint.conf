# ============================================================
# SmartPrint — Nginx Production Virtual Host Configuration
# Place in: /etc/nginx/sites-available/smartprint
# Symlink to: /etc/nginx/sites-enabled/smartprint
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name _; # Catch-all for EC2 Public IP / DNS, replace with domain once assigned

    # Root directory for compiled React static assets
    root /home/ubuntu/smartprint/frontend/dist;
    index index.html;

    # Maximum allowed customer document upload size
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # Gzip Compression for fast delivery on mobile connections
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. Frontend SPA Routing — route all non-file paths to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ensure index.html is never aggressively cached by mobile browsers
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        expires off;
    }

    # 2. Static Assets Caching (immutable bundle files with content hashes)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
    }

    # 3. Backend REST API Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for document uploads & processing
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # 4. Backend Health Check Endpoint
    location /health {
        proxy_pass http://127.0.0.1:5000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 5. Socket.IO Real-time WebSocket Upgrades
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
