# ============================================================
# SmartPrint — Nginx Production Virtual Host Configuration
# Place in: /etc/nginx/sites-available/smartprint
# Symlink to: /etc/nginx/sites-enabled/smartprint
#
# Production Transport Security (HTTPS):
# To obtain a free Let's Encrypt SSL certificate using certbot:
#   1. Ensure DNS A record for your domain points to this server's public IP.
#   2. Install certbot:
#        sudo apt update && sudo apt install -y certbot python3-certbot-nginx
#   3. Run certbot for your domain:
#        sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com
#      (Or for an sslip.io hostname: sudo certbot --nginx -d 54.79.20.200.sslip.io)
#   4. Certbot will automatically populate/manage ssl_certificate directives.
# ============================================================

# ── HTTP: Redirect all Port 80 traffic to HTTPS ────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Redirect all HTTP requests to HTTPS with a permanent 301
    return 301 https://$host$request_uri;
}

# ── HTTPS: Secure Production Server on Port 443 ────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _; # Replace with your production domain (e.g. smartprint.example.com)

    # SSL Certificate & Private Key (Let's Encrypt / Certbot paths)
    # Default active certificate on EC2 instance (or placeholder for fresh setups):
    ssl_certificate /etc/letsencrypt/live/54.79.20.200.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/54.79.20.200.sslip.io/privkey.pem;

    # Modern TLS Protocols & Ciphers (Mozilla Intermediate Configuration)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Transport Security Headers
    # HSTS: Enforces HTTPS across all subdomains for 1 year
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Root directory for compiled React static assets
    root /home/ubuntu/smartprint/frontend/dist;
    index index.html;

    # Maximum allowed customer document upload size
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # Gzip Compression for fast delivery on mobile connections
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 1. Frontend SPA Routing — route all non-file paths to index.html
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        expires off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Static Assets Caching (immutable bundle files with content hashes)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # 3. Backend REST API Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Timeouts for document uploads & processing
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # 4. Backend Health Check Endpoint
    location /health {
        proxy_pass http://127.0.0.1:5000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 5. Socket.IO Real-time WebSocket Upgrades
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
